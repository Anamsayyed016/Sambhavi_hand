# Example Sambhavi site config (SSL blocks usually managed by Certbot).
# DO NOT use this file for AFTIONIX.
#
# One-time change from hard-coded proxy_pass :3001 to upstream sambhavi_backend.

server {
    server_name sambhaviheritagereimagined.com www.sambhaviheritagereimagined.com;

    include /etc/nginx/snippets/sambhavi-upstream.conf;

    location / {
        proxy_pass http://sambhavi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Admin media upload only: product videos up to 50 MB (MAX_VIDEO_BYTES) + multipart overhead.
    # Every other route keeps the nginx default (1m).
    location = /api/admin/media/upload {
        client_max_body_size 60m;
        proxy_pass http://sambhavi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # listen 443 ssl; # managed by Certbot
    # ssl_certificate ...
}

server {
    listen 80;
    listen [::]:80;
    server_name sambhaviheritagereimagined.com www.sambhaviheritagereimagined.com;
    return 301 https://$host$request_uri;
}
